name: TraceGate CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  edge-runtime:
    name: Edge runtime / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python sources
        run: python -m compileall -q tracegate tracegate.py scripts tests

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  dotnet-mes-lab:
    name: MES lab / .NET 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/dotnet-mes

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python test harness
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore .NET dependencies
        run: dotnet restore src/TraceGate.MesLab

      - name: Build the MES lab
        run: dotnet build src/TraceGate.MesLab --no-restore

      - name: Run real-process integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate browser JavaScript syntax
        run: node --check src/TraceGate.MesLab/wwwroot/app.js

  public-release:
    name: Public release safety
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan tracked portfolio content
        run: python scripts/public_release_check.py .
