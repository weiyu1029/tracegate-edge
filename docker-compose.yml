name: tracegate-edge

services:
  mock-mes:
    build:
      context: .
    command: ["mock-mes"]
    environment:
      TRACEGATE_DATA_DIR: /data
      TRACEGATE_MOCK_MES_HOST: 0.0.0.0
      TRACEGATE_MOCK_MES_PORT: 8081
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - mock-mes-data:/data
    ports:
      - "127.0.0.1:${TRACEGATE_MOCK_PUBLISHED_PORT:-8081}:8081"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/v1/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  edge:
    build:
      context: .
    command: ["edge"]
    environment:
      TRACEGATE_DATA_DIR: /data
      TRACEGATE_HOST: 0.0.0.0
      TRACEGATE_PORT: 8080
      TRACEGATE_MES_URL: http://mock-mes:8081/api/v1/trace-events
      TRACEGATE_OUTBOX_INTERVAL: ${TRACEGATE_OUTBOX_INTERVAL:-1}
      TRACEGATE_OUTBOX_TIMEOUT: ${TRACEGATE_OUTBOX_TIMEOUT:-4}
      TRACEGATE_OUTBOX_MAX_ATTEMPTS: ${TRACEGATE_OUTBOX_MAX_ATTEMPTS:-8}
      TRACEGATE_OUTBOX_BATCH: ${TRACEGATE_OUTBOX_BATCH:-20}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - edge-data:/data
    ports:
      - "${TRACEGATE_PUBLISHED_PORT:-8080}:8080"
    # Deliberately no health-gated dependency on mock-mes: the edge must boot,
    # commit locally, and let its outbox retry while the upstream is unavailable.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  edge-data:
  mock-mes-data:
